ሕገ መንግስታዊ ሕጊ፣ ብንጹርን ዝተዋደደን ኣገባብ ዝቐርብ፤

1. ሕገ መንግስቲ
ንመንግስቲ ዝውድብ መሰረታዊ ጽሑፍ
ትካላትን ስልጣኖምን ይገልጽ
መሰልን ናጽነትን ዜጋታት የውሕስ

2. መንግስቲ
ካብ ዝቖመ ሕጋዊ ኣካል፤
ግዝኣት
በዝሒ ህዝቢ
ፖለቲካዊ ስልጣን
ቅጥዕታት መንግስቲ፤
ኣሃዳዊ መንግስቲ
ፌደራል ክልል ትግራይ

3. ልኡላውነት
ላዕለዋይ ስልጣን መንግስቲ
ናይዞም ክኾኑ ይኽእሉ፤
ህዝቢ (ህዝባዊ ልኡላውነት)
እቲ ህዝቢ (ሃገራዊ ልኡላውነት)

4. ምፍልላይ ስልጣን
ብሞንተስኪዮ ዝተዳለወ መትከል
ሓጋጊ ስልጣን: ሕግታት ይገብር
ፈጻሚ ስልጣን: ሕግታት የተግብር
ፍርዳዊ ስልጣን፡ ንክርክር ይፈርድ
ዕላማ፡ ምልኪ ንምክልኻልን ሚዛን ንምውሓስን እዩ።

5. ፖለቲካዊ ስርዓታት
ስርዓት ባይቶ፡ ምትሕብባር ኣብ መንጎ ፈጻምን ሓጋጊ ኣካልን ጨናፍር
ፕረዚደንታዊ ስርዓት፡ ጽኑዕ ምፍልላይ ስልጣን
ፍርቂ ፕረዚደንታዊ ስርዓት፡ ናይ ክልቲኦም ምትሕውዋስ እዩ።

6. ፖለቲካዊ ትካላት
መራሒ ሃገር (ፕረዚደንት ወይ ንጉስ)
መንግስቲ
ባይቶ (ሃገራዊ ባይቶ፡ ሰኔት)
ኣብያተ ፍርድን ቤት ፍርዲን

7. ልዕልና ሕጊ
መንግስቲ ኣብ ትሕቲ ሕጊ እዩ ዝግዛእ
ምኽባር ስርዓተ-መሰረት ስርዓታት
ምሕላው መሰረታዊ መሰላት

8. ሕገ መንግስታዊ ዳግመ ግምት
ሕግታት ምስ ሕገ መንግስቲ ዝሰማምዑ ምዃኖም የረጋግጽ
ብሕገ መንግስታዊ ቤት ፍርዲ ዝተረጋገፀ

9. መሰረታዊ መሰላትን ናጽነታትን
ሓሳብካ ናይ ምግላጽ ናጽነት
መሰል ህይወት
ናይ ምትእኽኻብ ናጽነት
መሰል ፍትሓዊ ፍርዲ

10. ሕገ መንግስታዊ ምኽልካል
ኣሰራርሓ ምምሕያሽ ሕገ መንግስቲ
መብዛሕትኡ ግዜ ንመጥቃዕቲ ንምክልኻል ዝምራሕ እዩ።








@#####




ብንጹርን ዝተዋደደን ኣገባብ ዝቐረበ ስነ-ገበን፤

1. ትርጉም ስነ-ገበን (criminology)
ስነ-ገበን ንገበን፡ ገበነኛ፡ ግዳይ፡ ከምኡ’ውን ገበን ንምምካት ዝሕግዙ ኣገባባት ዘጽንዕ ሳይንስ እዩ።

2. ገበን
ብሕጊ ዝተኸልከለን ብገበናዊ መቕጻዕቲ ዝቕጻዕን ተግባር።
ከምዚ ዝስዕብ ክምደብ ይኽእል፤
ፍራይም (ዕቱብ)
ወተሃደራዊ ገበን (ማእከላይ)
ምጥሓስ ሕጊ (ንእሽቶ) .

3. እቲ ገበነኛ
በደል ዝፍጽም ሰብ።
ብመሰረት ዝተፅንዐ፤
ስብእነቶም
ማሕበራዊ ሃዋህውኦም
ድርኺቶም

4. ጠንቂ ገበን
ውልቃዊ ረቛሒታት፡ ስነ-ኣእምሮኣዊ ጸገማት፡ ስብእና።
ማሕበራዊ ረቛሒታት፡ ድኽነት፡ ሽቕለት ኣልቦነት፡ ዘይማዕርነት
ረቛሒታት ስድራቤት፡ ትምህርቲ፡ ክትትል
ረቛሒታት ከባቢ፡ መነባብሮ ከባቢ፡ ከተማነት

5. ስነ-ገበናዊ ክልሰ-ሓሳባት
ክላሲካል ክልሰ-ሓሳብ፡ ናጻ ድሌት (ገበን ንምፍጻም ዝግበር ምርጫ)
ኣወንታዊ ክልሰ-ሓሳብ፡ ጽልዋ ስነ-ህይወታውን ማሕበራውን ረቛሒታት
ስነ-ማሕበረሰብኣዊ ክልሰ-ሓሳብ፡ ተራ ሕብረተሰብ ኣብ ገበን።

6. እቲ ግዳይ (ግዳይነት) .
መጽናዕቲ ግዳይ ገበን
ተራኦምን ተቓላዕነቶምን ዘጋጠሞም ሳዕቤናትን ይትንትን

7. እቲ ማሕበራዊ ምላሽ
ኩሉ እቲ ሕብረተሰብ ንገበን ዝህቦ ምላሽ፤
ፖሊስ
ፍትሒ
እስር ቤት
ማሕበራዊ ዳግመ ውህደት

8. ምክልኻል ገበን
ማሕበራዊ ምክልኻል፡ ትምህርቲ፡ ስራሕ
ኩነታዊ ምክልኻል፡ ጸጥታ፡ ምክትታል
ምክልኻል ገበን፡ ሕግታትን እገዳታትን

9. ምድግጋም ገበን ምግባር
ድሕሪ ምፍራድ ካልእ ገበን ናይ ምፍጻም ተግባር
ኣብ ስነ-ገበን ማእከላይ ጸገም

10. ገበናዊ ፖሊሲ
መንግስቲ ገበን ንምምካት ዘተግብሮ ስብስብ ስትራተጂታት።




ውሽጣዊ ህዝባዊ ሕጊ (ንጹርን ኣገዳስን)፤

1. ትርጉም ውሽጣዊ ህዝባዊ ሕጊ
ንሱ ድማ እቲ ዝመርሕ ኣካል ሕግታት እዩ፤
ኣሰራርሓ መንግስቲ ዝምልከት ምዃኑ’ዩ።
ኣብ መንጎ መንግስትን ዜጋታታን ዘሎ ዝምድናታት
ኣብ ውሽጢ ሓንቲ ሃገር ዝርከቡ መንግስታዊ ትካላት

2. ጨናፍር ውሽጣዊ ህዝባዊ ሕጊ
ቅዋማዊ ሕጊ፡ ውደባ ስልጣን (ፕረዚደንት፡ ባይቶ፡ መንግስቲ)
ምምሕዳራዊ ሕጊ፡ ኣሰራርሓ ህዝባዊ ምምሕዳር
ሕጊ ግብሪ፡ ምስ ግብሪ ዝተኣሳሰሩ ሕግታት
ሕጊ ምምሕዳር ከባቢ፡ ምሕደራ ኣውራጃታት፡ ኮሙናት ወዘተ።

3. መንግስቲ
ቅዋማት ባእታታት፤
ግዝኣት
በዝሒ ህዝቢ
ልኡላውነት (ልዑል ስልጣን ናይ ምውሳን)

4. ሕገ መንግስቲ
መሰረታዊ ሕጊ መንግስቲ
ህዝባዊ ስልጣን ይውድብ
መሰረታዊ መሰላት ዜጋታት የውሕስ

5. ምፍልላይ ስልጣን
ፈጻሚ ስልጣን: ሕግታት የተግብር
ሓጋጊ ስልጣን: ሕግታት የሕልፍ
ፍርዳዊ ስልጣን፡ ይፈርድን ይቐጽዕን

6. መትከል ሕጋውነት
እቲ ምምሕዳር ሕጊ ከኽብር ኣለዎ።
ዝኾነ ተግባር ልዕሊ ሕጊ ክኸውን ኣይክእልን እዩ።

7. ህዝባዊ ኣገልግሎት
ብመንግስቲ ዝቐርብ ሓፈሻዊ ረብሓ ዘለዎ ንጥፈት
መትከላት፤
ቀጻልነት
ማዕርነት
ምትዕጽጻፍ

8. ምምሕዳራዊ ተግባራት
ብምምሕዳር ዝውሰድ ውሳነታት
ክኸውን ይኽእል፤
ምቁጽጻር (ሓፈሻዊ) .
ውልቀ ሰብ





ሕጊ ግብሪ (ንጹርን ኣገደስትን ክዝከሩ ዘለዎም ነጥብታት)፤

1. ትርጉም ሕጊ ግብሪ
ሕጊ ግብሪ ንኹሎም ብመንግስትን ከባብያዊ ምምሕዳራትን ዝእከብ ግብሪ፣ ቀረፅን ኣበርክቶን ዝምልከቱ ሕግታት ዘጠቓለለ ጨንፈር ህዝባዊ ሕጊ እዩ።

2. ግብሪ
ግብሪ ማለት ዜጋታት ብዘይ ቀጥታዊ ካሕሳ ንመንግስቲ ክኸፍልዎ ዘለዎም ድምር ገንዘብ እዩ፣ ንመንግስታዊ ወጻኢታት ንምምዋል።

ኣብነታት፡ ቫት፡ ግብሪ ኣታዊ።

3. ምንጭታት ሕጊ ግብሪ
ሕጊ ግብሪ (ቀንዲ ምንጪ)
ሕገ መንግስቲ
ኣህጉራዊ ዋዕላታት
ሕጊ ፍርዲ
ምምሕዳራዊ ዶክትሪን።

4. መሰረታዊ መትከላት ግብሪ
መትከል ሕጋውነት፦ ሕጊ ጥራይ እዩ ግብሪ ዝፈጥር
መትከል ማዕርነት፦ ኩሎም ዜጋታት ኣብ ቅድሚ ሕጊ ማዕረ እዮም።
መትከል ኣድላይነት፦ ግብሪ ንረብሓ ህዝቢ የገልግል

5. ባእታታት ግብሪ
ከፋሊ ግብሪ፦ እቲ ግብሪ ዝኸፍል ሰብ
ግብሪ ዝኽፈል ንብረት፡- እንታይ እዩ ግብሪ ዝኽፈል (ኣታዊ፡ ሃልኪ ወዘተ)
መጠን ግብሪ፦ እቲ ዝትግበር ሚእታዊት
መሰረት ግብሪ፡- ግብሪ ንምሕሳብ ዝሕግዝ መሰረት

6. ዓይነታት ግብሪ
ቀጥታዊ ግብሪ፦ ብቐጥታ ብከፋሊ ግብሪ ዝኽፈል (ንኣብነት ግብሪ ኣታዊ)
ዘይቀጥታዊ ግብሪ፡ ኣብ ዋጋታት ዝተሓወሶ (ንኣብነት፡ ቫት)

7. ሜላታት ግብሪ
ምምላስ ግብሪ፦ ከፋሊ ግብሪ ኣታዊኦም ይገልጽ
ገምጋም፡ ስሌት ናይቲ ግብሪ
ምእካብ፡ ምኽፋል ግብሪ
ኦዲት ግብሪ፦ ብበዓል መዚ ግብሪ ምርግጋፅ

8. ምትላልን ምህዳምን ግብሪ
ምትላል ግብሪ (Tax Fraud)፦ ግብሪ ንኸይትኸፍል ዝግበር ዘይሕጋዊ ተግባር
ምህዳም ግብሪ፡- ኣብ ሕጊ ንዘሎ ነዃላት ምምዝማዝ ግብሪ ንምንካይ

9. መቕጻዕቲ ግብሪ
ዘይምኽባር ኣብ ዝፍጠረሉ እዋን፤
መቕጻዕቲ
መቕጻዕቲ
ሕጋዊ ክሲ

10. ምኽሳስ ግብሪ
ኩሉ ኣብ መንጎ ከፋሊ ግብሪን በዓል መዚ ግብሪን ዝፍጠር ዘይምርድዳእ (ጠለባት፣ ይግባይ ናብ ኣብያተ ፍርዲ)።






ቀዳምነት ክወሃቡ ዘለዎም ነገራት ፣  እቲ  ዘለኻዮ   ቦታ ናብ እትደልዮን ከዕውተካ  ዝኽእልን  ውሳነታት ከወስነክ ይኽእልዶ ኣድቂቅካ ምምርማር ። 

 

001_ ኣብ ትምህርቲ ዝተመርኮሰ ፣  ዘመናዊ  ሕርሻ  ወፍሪ  ንምግባር  መጾናዕቲ  ምሳድ፣ ብጉጅለን ብውህደትን ዝግበር                                                                                                      ወፍሪ  ምልምማድን ፣ምዝውታርን ።  

          ኣብ  ሳይነሳውን  ባህላውን ዝተሞርኮሰ  መጽናዕቲ  ብደቂቅ  ምሳድ ፣ 

002  መፍረ  እንስሳ ፣ ናብ  ምርግጋእ  ቁጠባዊ  ባይታ  ስለ  ዝፈጥር  ኣብ ወዳምነት ክስራዕን ክስራሓሉን ይግባእ ። 

