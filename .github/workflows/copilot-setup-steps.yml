
ኣብ መንጎ ገበናውን ሲቪላውን መስርሕ ዘሎ ፍልልይ፡ ብዝያዳ ቴክኒካውን ሕጋውን ኣገባብ፤

 1. ሕጋዊ ባህርን ዕላማን
ገበናዊ ኣገባብ፤
ምስ ገበናዊ ሕጊ ዝተኣሳሰር ጨንፈር ህዝባዊ ሕጊ ኮይኑ፡ ነቲ መንግስቲ ዘለዎ ናይ ምቕጻዕ መሰል (jus puniendi) ዘተግብር እዩ።

 ዕላማ፡ ምዕፋን ገበናት + ምክልኻል ህዝባዊ ስርዓት።

ሲቪላዊ ኣገባብ፤
ጨንፈር ናይ ብሕቲ ሕጊ ኮይኑ፡ ኣብ መንጎ ውልቀሰባት ዝፍጠር ዘይምርድዳእ ዝመርሕ እዩ።

 ዕላማ: ንዘጋጠመ ዘይምርድዳእ ንምፍታሕን ሕጋዊ ሚዛን (ካሕሳ) ንምምላስን እዩ።

 2. ስልጣን ፍርዲ
ገበነኛ፤
ህዝባዊ ምኽሳስ ናይ መንግስቲ ኮይኑ፡ ብዓቃቢ ሕጊ ህዝቢ ዝፍጸም እዩ።

 ግዳይ ተሓጋጋዚ ሲቪላዊ ክሲ ኣብ ቅድሚ ገበናዊ ቤት ፍርዲ ከቕርብ ይኽእል እዩ። ሲቪላዊ ሕጊ፤
ሕጋዊ ስጉምቲ ናይ ምቕራብ መሰል ናይ ውልቀ ውድባት እዩ (መትከል ውድባዊ ርእሰ-ምሕደራ)። ‎
3. መምርሒ መትከላት
 ኣብ ገበናዊ መስርሕ፤
መትከል ሕጋውነት ክሲ (ወይ ከከም ስርዓት ናይ ዓቃቢ ሕጊ ውሳነ)
መትከል ተጻባኢ መስርሕ
መትከል ናይ ንጽህና ግምት
መትከል ሕጋውነት ገበናትን መቕጻዕትን
ንጡፍ ተራ ዳኛ ኣብ ምምስራት ሓቂ (መብዛሕትኡ ግዜ መርማሪ ኣገባብ)
 ኣብ ሲቪላዊ መስርሕ፤
መትከል ርእሰ-ምሕደራ ውድባት (እቶም ወገናት ነቲ ፍርዲ ይመርሕዎ)
መትከል ተጻባኢ መስርሕ
መትከል ፍርዳዊ ገለልትነት
መትከል ህዝባዊ መስርሕ ፍርዲ (ብዘይካ)
ብመሰረቱ ተጻባኢ ኣገባብ እዩ።
‎
 4. ጾርን ሕግታት መርትዖን።
ገበነኛ፤
 ጾር መርትዖ ኣብ ዓቃቢ ሕጊ (ቤት ጽሕፈት ዓቃቢ ሕጊ) (ህዝባዊ)
 ልዑል ደረጃ መርትዖ: ኪኖ ምኽንያታዊ ጥርጣረ
 ናጽነት መርትዖ (ብዘይካ ኣብ ዝተወሰኑ ጉዳያት)
ሲቪል:
 ብመሰረት መትከል ዝተዓደለ ጾር መርትዖ: “actori incumbit probatio”
 ውሑድ ጽኑዕ ደረጃ መርትዖ (ብዝሒ ተኽእሎታት)
 መርትዖታት መብዛሕትኡ ግዜ ዝተገደቡ (ጽሑፋዊ ሰነዳት፡ ምስክርነት ወዘተ)

 5. መስርሕ መስርሕ
ገበነኛ፤
ምዕራፍ መርመራ (ፍርዳዊ ፖሊስ)
መባእታዊ መርመራ (ከከም ስርዓት)
ፍርዲ (ገበናዊ ቤት ፍርዲ)
ሲቪል:
ጻውዒት/ምሕሳብ
ንፍርዲ ምድላው
ናይ ፍርዲ መስርሕ
እቲ ውሳነ ምትግባር

 6. እንታይነት እገዳ
ገበነኛ፤

 መቕጻዕቲ (ማእሰርቲ፡ መቕጻዕቲ፡ ኣገልግሎት ማሕበረሰብ ወዘተ)
 ስጉምትታት ጸጥታ
ሲቪል:
 ምጽጋን (ጉድኣት)
 ምትግባር (ምምንዛዕ፣ ምግፋፍ ወዘተ)
ስርዝ ድልዝ ወይ ምስራዝ ተግባራት

 7. ረስ ጁዲካታ
ብመትከል ገበናዊ ውሳነ ኣብ ልዕሊ ሲቪላዊ ጉዳያት ስልጣን ኣለዎ (ገበናዊ ፍርዲ ኣብ ልዕሊ ሲቪላዊ ፍርዲ ይቕድም)፣ ብፍላይ ድማ ንህላወ ጭብጥታትን ገበነኛነትን ብዝምልከት።

8. ኣብ መንጎ ክልቲኦም ዝግበር ምትእስሳር
ተመሳሳሊ ኩነታት ድማ ንዝስዕቡ ክፈጥር ይኽእል እዩ፤
ገበናዊ መስርሕ (ንኣብነት ስርቂ)
ሲቪላዊ ክሲ (ንኣብነት፡ ካሕሳ ግዳይ)
 እቲ ግዳይ ክኸውን ዝኽእል፤
ፍሉይ ሲቪላዊ ክሲ ምቕራብ
ወይ ኣብ ገበናዊ መስርሕ ሲቪላዊ ውድብ ምዃን።

ብደረጃ ማስተርስ ዝካየድ ሲቪላዊ ኣገባብ፡ ኣብ ኣስተምህሮታት ወይ ምርምር ቀጥታዊ ኣጠቓቕማ ብትኽክል፡ ብሕጽር ዝበለን ዝተዋደደን ኣገባብ፤

1. ስልጣንን ብቕዓትን
ርእሰ-ጉዳይ ስልጣን ፍርዲ፡ ብባህሪ ናይቲ ክርክር ዝውሰን (ንኣብነት፡ ንግዳዊ ቤት ፍርዲ ንንግዳዊ ክርክር፡ ሲቪላዊ ቤት ፍርዲ ንብረታዊ ክርክር)።
ግዝኣታዊ ስልጣን (Teritorial jurisdiction)፦ ኣብ መንበሪ ገዛ ተኸሳሲ፣ ነቲ ክርክር ዝፈጠረሉ ቦታ፣ ወይ ድማ ኣቀማምጣ እቲ ዘካትዕ ንብረት መሰረት ብምግባር ብቑዕ ቤት ፍርዲ ይምስርት።
ስልጣን ርእሰ-ጉዳይ፦ ዝተወሰኑ ጉዳያት ንፍሉያት ኣብያተ ፍርዲ ዝተሓዝኡ እዮም (ንኣብነት፡ ጉዳያት ማሕበራዊ ድሕነት፡ ምምሕዳራዊ ክርክር)።
ሓፈሻዊ ሕጊ፡ ስልጣን ፍርዲ ብናይ ገዛእ ርእሱ ድሌት ወይ ከም መባእታዊ ተቓውሞ ክለዓል ኣለዎ።

2. ኣብቲ መስርሕ ዝሳተፉ ወገናት
ከሳሲ፡ ሕጋዊ ስጉምቲ ዘበገሰ ወገን።

ተኸሳሲ፡ እቲ ክሲ ዝቐርበሉ ወገን።

ጣልቃ ዝኣትዉ፡- ኣብቲ መስርሕ ክጽንበሩ ዝኽእሉ ሳልሳይ ወገን (ግዱድ ወይ ብወለንታ ምትእትታው)።

ምትኽኻእ ወገናት፡- ሓደ ውድብ ኣብ ዝሞተሉ እዋን፡ ውህደት ወይ ምምዳብ መሰላት ኣብ ዘጋጥመሉ እዋን ምትካእ ዝምልከት ሕግታት።

3. ኣገባባዊ ሰነዳት።
መስርሕ ምጅማር፡- ጻውዒት ወይ መመልከቲ፡ ከከም ዓይነት ኣገባብ።

ጥርዓናት፡- ነቲ ክስታትን ሕጋዊ ምጉታትን ዝገልጽ ጽሑፋዊ መግለጺታት።
ንጊዚያዊ ረድኤት ዝቐርብ ጻውዒት፡- ግዝያዊ ወይ ህጹጽ ውሳነ ንምርካብ የኽእል።

ኣገልግሎትን ምልክታን፡- ምስ መትከል ተጻባኢ መስርሕ ምኽባር የረጋግጽ።

4. ኣካይዳ ፍርዲ
መባእታዊ መርመራ፦ ምዕራፍ መርመራ መርትዖ፣ ምእካብ መርትዖን ምድላው ፋይል ጉዳይን።

ምስማዕ፡ ምግጣም ወገናትን ኣፋዊ ምቕራብ ክትዓትን።
ኣፋዊ ክትዕ፦ ነፍሲ ወከፍ ወገን ኣብ ቅድሚ ቤት ፍርዲ ዝቐርብ ኣፋዊ ክትዕ። ፍርዲ፡- ብዛዕባ መርትዖ ወይ ቅጥዒ ምኽንያታዊ ውሳነ፡ ይግባይ ክበሃል ይከኣል።

ምትግባር፡- ውሳነታት ቤት ፍርዲ ምትግባር (ምምንዛዕ፡ ክፍሊት መቕጻዕቲ፡ ብግዴታ ምፍጻም)።

5. ኣብ ሲቪላዊ መስርሕ መርትዖ
መትከል ናጽነት መርትዖ፦ ብሕጊ ካልእ እንተዘይተቐሚጡ ኩሉ መርትዖ ተቐባልነት ኣለዎ።

ጾር መርትዖ፦ ብመትከል ሕጋዊ ግምት ነዚ እንተዘይገልቢጡ ኣብ ከሳሲ እዩ ዝዓርፍ።

ኣገባብ መርትዖ፡ ጽሑፋዊ ሰነዳት፡ ምስክርነት፡ ግምታት፡ ርእይቶ ክኢላታት፡ ምቕባል።

ኤሌክትሮኒካዊ መርትዖ፦ ብመሰረት ሕግታት ተቐባልነትን ምርግጋፅን ተቐባልነት ዘለዎ እዩ።

6. መሰረታዊ መትከላት
መትከል ተጻባኢ መስርሕ፡ ነፍሲ ወከፍ ወገን ነቶም ተጻረርቲ ስነ-ሞጎታት ክፈልጦምን ክዛተየሎምን ኣለዎ።

መትከል ፍትሓውነት፡ ምኽልካል ናይ ምትላል ተግባራት።

መትከል ማዕርነት ኣጽዋር፡ ነፍሲ ወከፍ ወገን ጉዳዩ ዝከላኸለሉ ሓደ ዓይነት ኣገባብ ክህልዎ ኣለዎ።

መትከል ዕላዊነት፦ እቲ መስርሕ ፍርዲ ብዘይካ ኣብ ዝተወሰኑ ጉዳያት (ሓለዋ ትሕቲ ዕድመ ቆልዑ፣ ምስጢር መንግስቲ) ንህዝቢ ዝረአ እዩ።

7. መድሃኒታት
ይግባይ፡ ምሉእ ብምሉእ ነቲ ሓቅታትን ሕግን ብላዕለዋይ ቤት ፍርዲ ምግምጋም።
ይግባይ ናብ ቤት ፍርዲ ምኽሳስ፡ ዳግመ ግምት ስሩዕነት ናይቲ ኣገባብን ቅኑዕ ኣተገባብራ ሕግን።
ተቓውሞን ናይ ሳልሳይ ወገን ተቓውሞን፡- ብዘይሕጋዊ መንገዲ ንዝተዋህበ ፍርዲ ምቅዋም ወይ ንሳልሳይ ወገን ምጽላው።
ንኽግምገም መመልከቲ: ናይ መወዳእታ ውሳነ ብኸቢድ ጌጋ ወይ ምትላል እንተተበኪሉ ይከኣል እዩ።


